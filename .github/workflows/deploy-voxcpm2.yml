name: Deploy VoxCPM2 Inference Service

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'services/zarax-voxcpm2-inference/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Modal
        run: pip install modal

      - name: Set Modal token
        run: |
          modal token set \
            --token-id "${{ secrets.MODAL_TOKEN_ID }}" \
            --token-secret "${{ secrets.MODAL_TOKEN_SECRET }}"

      - name: Create VoxCPM2 secret
        run: |
          modal secret create zarax-voxcpm2-secret \
            ZARAX_VOXCPM2_SERVICE_TOKEN="${{ secrets.ZARAX_VOXCPM2_SERVICE_TOKEN }}" \
            --force || true

      - name: Deploy VoxCPM2 service
        run: |
          modal deploy services/zarax-voxcpm2-inference/modal_app.py \
            2>&1 | tee voxcpm2_deploy.log

      - name: Upload deploy log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: voxcpm2-deploy-log
          path: voxcpm2_deploy.log
