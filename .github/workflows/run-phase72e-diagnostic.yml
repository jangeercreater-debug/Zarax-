name: Phase 7.2.E — Root-Cause Diagnostic

on:
  workflow_dispatch:

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Modal
        run: pip install modal

      - name: Set Modal token
        run: |
          modal token set \
            --token-id "${{ secrets.MODAL_TOKEN_ID }}" \
            --token-secret "${{ secrets.MODAL_TOKEN_SECRET }}"

      - name: Run Phase 7.2.E Diagnostic
        run: |
          modal run services/zarax-tts-r-and-d/phase72e_diagnostic.py \
            2>&1 | tee phase72e_log.txt
          echo "EXIT CODE: $?"

      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase72e-results
          path: |
            phase72e_log.txt
            phase72e_report.json
          retention-days: 30
