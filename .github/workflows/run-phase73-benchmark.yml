name: Phase 7.3 — Foundation Model Benchmark

on:
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Modal
        run: pip install modal

      - name: Set Modal token
        run: |
          modal token set \
            --token-id "${{ secrets.MODAL_TOKEN_ID }}" \
            --token-secret "${{ secrets.MODAL_TOKEN_SECRET }}"

      - name: Refresh HF secret
        run: |
          modal secret create zarax-rnd-hf-secret \
            HF_TOKEN="${{ secrets.HF_TOKEN }}" \
            --force || true

      - name: Run Phase 7.3 Benchmark
        run: |
          modal run services/zarax-tts-r-and-d/phase73_foundation_benchmark.py \
            2>&1 | tee phase73_log.txt

      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase73-benchmark-results
          path: |
            phase73_log.txt
            phase73_report.json
          retention-days: 30
