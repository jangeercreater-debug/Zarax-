name: Zarax CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm turbo run build --filter=@zarax/shared-types... --filter=@zarax/database...

      - name: Build API service
        run: pnpm turbo run build --filter=@zarax/api

      - name: Build LLM Orchestrator
        run: pnpm turbo run build --filter=@zarax/llm-orchestrator

      - name: Build Voice Runtime
        run: pnpm turbo run build --filter=@zarax/voice-runtime

      - name: Build Web
        run: pnpm turbo run build --filter=@zarax/web
        env:
          NEXT_PUBLIC_API_URL: https://zaraxapi-production.up.railway.app
