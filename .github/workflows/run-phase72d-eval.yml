name: Phase 7.2.D — Evaluation

on:
  workflow_dispatch:

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Modal
        run: pip install modal

      - name: Set Modal token
        run: |
          modal token set \
            --token-id "${{ secrets.MODAL_TOKEN_ID }}" \
            --token-secret "${{ secrets.MODAL_TOKEN_SECRET }}"

      - name: Run Phase 7.2.D Evaluation
        run: |
          modal run services/zarax-tts-r-and-d/phase72d_evaluation.py \
            2>&1 | tee phase72d_log.txt
          echo "EXIT CODE: $?"

      - name: Upload evaluation log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase72d-results
          path: |
            phase72d_log.txt
            phase72d_report.json
          retention-days: 30
