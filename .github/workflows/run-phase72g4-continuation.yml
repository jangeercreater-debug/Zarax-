name: Phase 7.2.G4-A — Step 2000→5000 Continuation

on:
  workflow_dispatch:

jobs:
  g4a-continuation:
    runs-on: ubuntu-latest
    timeout-minutes: 600
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Modal
        run: pip install modal

      - name: Set Modal token
        run: |
          modal token set \
            --token-id "${{ secrets.MODAL_TOKEN_ID }}" \
            --token-secret "${{ secrets.MODAL_TOKEN_SECRET }}"

      - name: Refresh HF secret
        run: |
          modal secret create zarax-rnd-hf-secret \
            HF_TOKEN="${{ secrets.HF_TOKEN }}" \
            --force || true

      - name: Run G4-A continuation (Step 2000 → 5000)
        run: |
          echo "Checkpoint type: ADAPTER-ONLY (weight continuation)"
          echo "Start: 2000 | Target: 5000 | Remaining: 3000 steps"
          echo "Expected: ~2.5 hours | ~\$2.05"
          modal run services/zarax-tts-r-and-d/phase72g4_continuation.py \
            2>&1 | tee phase72g4_continuation_log.txt
          echo "EXIT CODE: $?"

      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase72g4-continuation-results
          path: |
            phase72g4_continuation_log.txt
            phase72g4_continuation_report.json
          retention-days: 30
