name: Phase 7.2.F — Gated Experiments F1→F2→F3

on:
  workflow_dispatch:

jobs:
  gated-experiments:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Modal
        run: pip install modal

      - name: Set Modal token
        run: |
          modal token set \
            --token-id "${{ secrets.MODAL_TOKEN_ID }}" \
            --token-secret "${{ secrets.MODAL_TOKEN_SECRET }}"

      - name: Run Phase 7.2.F Gated Experiments
        run: |
          modal run services/zarax-tts-r-and-d/phase72f_gated_experiments.py \
            2>&1 | tee phase72f_log.txt
          echo "EXIT CODE: $?"

      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase72f-results
          path: |
            phase72f_log.txt
            phase72f_report.json
          retention-days: 30
