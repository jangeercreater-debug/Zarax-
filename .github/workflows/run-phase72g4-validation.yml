name: Phase 7.2.G4-A — Step-5000 Quality Validation

on:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Modal
        run: pip install modal

      - name: Set Modal token
        run: |
          modal token set \
            --token-id "${{ secrets.MODAL_TOKEN_ID }}" \
            --token-secret "${{ secrets.MODAL_TOKEN_SECRET }}"

      - name: Refresh HF secret
        run: |
          modal secret create zarax-rnd-hf-secret \
            HF_TOKEN="${{ secrets.HF_TOKEN }}" \
            --force || true

      - name: Run Quality Validation
        run: |
          modal run services/zarax-tts-r-and-d/phase72g4_quality_validation.py \
            2>&1 | tee phase72g4_validation_log.txt

      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase72g4-validation-results
          path: |
            phase72g4_validation_log.txt
            phase72g4_validation_report.json
          retention-days: 30
